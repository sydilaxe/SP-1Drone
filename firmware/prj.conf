# SP-1Drone: Zephyr configuration. From SP-1FX's, after chattock/sp1-tape-looper's (MIT), which runs on SP-1
# hardware; USB audio the other way (the SP-1 a sound source the host records), the USB serial port for the status
# line.
CONFIG_LOG=n
CONFIG_ASSERT=n
CONFIG_IDLE_STACK_SIZE=128
CONFIG_ISR_STACK_SIZE=1024
CONFIG_WATCHDOG=y

# a fatal fault becomes a reboot (k_sys_fatal_error_handler); the watchdog backs up a hang
CONFIG_HW_STACK_PROTECTION=n
CONFIG_STACK_SENTINEL=y
CONFIG_REBOOT=y
CONFIG_CLOCK_CONTROL=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_SYNTH=y

# USB-C: audio to the host (UAC2, class compliant) + the status line (CDC ACM), composite
CONFIG_PRINTK=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_USBD_AUDIO2_CLASS=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_HWINFO=y
CONFIG_SAMPLE_USBD_VID=0x1915
CONFIG_SAMPLE_USBD_PID=0x5213
CONFIG_SAMPLE_USBD_MANUFACTURER="softmodded"
CONFIG_SAMPLE_USBD_PRODUCT="SP-1Drone"
# iOS camera adapters refuse accessories over 100 mA
CONFIG_SAMPLE_USBD_MAX_POWER=50
CONFIG_THREAD_RUNTIME_STATS=n
CONFIG_SCHED_THREAD_USAGE=n

CONFIG_ADC=y
CONFIG_I2C=y
CONFIG_I2S=y
CONFIG_I2S_NRFX=y
CONFIG_FPU=y
CONFIG_FPU_SHARING=y

CONFIG_MAIN_STACK_SIZE=2048
CONFIG_THREAD_STACK_INFO=y
